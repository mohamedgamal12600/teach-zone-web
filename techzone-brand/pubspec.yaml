name: techzone_brand
description: TechZone e-commerce Flutter app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

# 3) under the existing `flutter:` block:
assets:
  - assets/icon/

cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_lints: ^5.0.0
# 2) flutter pub add --dev flutter_launcher_icons flutter_native_splash

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#333742"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#333742"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#333742"
    image: assets/icon/splash_logo.png
